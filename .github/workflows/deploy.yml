name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  IMAGE_BASE: ghcr.io/mytonwallet-org/dns-image-gen

jobs:
  build-and-push:
    # A public repository is kept off the organization's own runners, which serve production.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      IMAGE_FULL: ${{ steps.set-variables.outputs.IMAGE_FULL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set env variables
        id: set-variables
        run: |
          SHORT_SHA=$(git rev-parse --short "${{ github.sha }}")
          IMAGE="$IMAGE_BASE:${{ github.ref_name }}"
          IMAGE_FULL="$IMAGE_BASE:${{ github.ref_name }}-$SHORT_SHA"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_FULL=$IMAGE_FULL" >> "$GITHUB_ENV"
          echo "IMAGE_FULL=$IMAGE_FULL" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build and push
        run: |
          docker build -t "${{ env.IMAGE }}" .
          docker push "${{ env.IMAGE }}"

          docker tag "${{ env.IMAGE }}" "${{ env.IMAGE_FULL }}"
          docker push "${{ env.IMAGE_FULL }}"
